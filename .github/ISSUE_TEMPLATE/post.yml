name: 📝 发布新文章
description: 用这个模板发博客文章，提交后 1-2 分钟自动构建上线
title: "文章标题"
body:
  - type: markdown
    attributes:
      value: |
        ## 发布说明
        - **标题栏** = 文章标题
        - **正文** = Markdown 内容（图片直接拖入，代码块直接写）
        - **标签** = 右侧 Labels 添加（**第一个标签 = 分类**，其余 = 标签；不添加则默认「随笔」）
        - 提交后 1-2 分钟自动上线；**编辑 Issue = 更新文章；关闭 Issue = 删除文章**
  - type: textarea
    id: content
    attributes:
      label: 文章正文
      description: Markdown 格式，图片直接拖入本框
      placeholder: "# 标题\n\n正文内容..."
      value: |
        <!-- 在这里写正文，支持 Markdown，图片直接拖入。发布前删掉这一行。 -->
    validations:
      required: true
